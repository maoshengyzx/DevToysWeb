<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found — DevToysWeb</title>
    <meta name="robots" content="noindex" />
    <script>
      // Cloudflare Pages serves 404.html for any unmatched path.
      // Redirect to homepage so React Router takes over.
      window.location.replace("/");
    </script>
  </head>
  <body>
    <noscript><p>Page not found. <a href="/">Go to homepage</a>.</p></noscript>
  </body>
</html>
